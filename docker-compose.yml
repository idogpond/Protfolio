version: "3.9"

services:
  # ─────────────────────────────────────────
  # Next.js Frontend
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: portfolio_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=/api
      - INTERNAL_API_URL=http://backend:8000/api
      - WATCHPACK_POLLING=true
    depends_on:
      - backend
    networks:
      - portfolio_network

  # ─────────────────────────────────────────
  # Laravel Backend
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolio_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
    environment:
      - APP_NAME=PortfolioAPI
      - APP_ENV=${APP_ENV:-local}
      - APP_KEY=
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_URL=${APP_URL:-http://localhost:8000}
      - LOG_CHANNEL=stack
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-portfolio_db}
      - DB_USERNAME=${DB_USERNAME:-portfolio_user}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - SANCTUM_STATEFUL_DOMAINS=${SANCTUM_STATEFUL_DOMAINS:-localhost:3000}
      - SESSION_DOMAIN=${SESSION_DOMAIN:-localhost}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@portfolio.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-password}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - portfolio_network

  # ─────────────────────────────────────────
  # MySQL 8.0
  # ─────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: portfolio_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:-portfolio_db}
      - MYSQL_USER=${DB_USERNAME:-portfolio_user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-secret}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - portfolio_network

  # ─────────────────────────────────────────
  # Cloudflare Tunnel (start with --profile tunnel)
  # Points directly at the frontend, which already proxies
  # /api/* to the backend via Next.js rewrites — no nginx needed.
  # ─────────────────────────────────────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: portfolio_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - frontend
    networks:
      - portfolio_network
    profiles:
      - tunnel

# ─────────────────────────────────────────
# Volumes & Networks
# ─────────────────────────────────────────
volumes:
  mysql_data:
    driver: local

networks:
  portfolio_network:
    driver: bridge
